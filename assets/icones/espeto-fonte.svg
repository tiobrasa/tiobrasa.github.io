<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#0b1633"/>
      <stop offset="1" stop-color="#050913"/>
    </radialGradient>
    <radialGradient id="brasa" cx="50%" cy="92%" r="55%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1cf9a"/>
      <stop offset="0.5" stop-color="#d9a766"/>
      <stop offset="1" stop-color="#a8733a"/>
    </linearGradient>
    <linearGradient id="carne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5532a"/>
      <stop offset="0.55" stop-color="#8a3a17"/>
      <stop offset="1" stop-color="#5a230c"/>
    </linearGradient>
    <linearGradient id="pimentao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.6" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.6" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="cebola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e6"/>
      <stop offset="1" stop-color="#e7d6b8"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="carneP">
      <rect x="-33" y="-42" width="66" height="84" rx="17" fill="url(#carne)"/>
      <rect x="-27" y="-38" width="54" height="20" rx="10" fill="#fff" opacity="0.13"/>
      <path d="M-14 -40 L-24 40 M10 -40 L0 40" stroke="#2a0f04" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
      <circle cx="18" cy="16" r="3" fill="#2a0f04" opacity="0.35"/>
      <circle cx="-20" cy="-6" r="2.4" fill="#e9a06b" opacity="0.5"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#fundo)"/>
  <rect width="512" height="512" fill="url(#brasa)"/>

  <g id="espeto" transform="translate(256 262) rotate(-45)" filter="url(#sombra)">
    <!-- palito -->
    <rect x="-222" y="-7" width="430" height="14" rx="7" fill="url(#madeira)"/>
    <path d="M206 -7 L246 0 L206 7 Z" fill="#d9a766"/>
    <rect x="-222" y="-7" width="54" height="14" rx="7" fill="#c08b4c"/>
    <!-- pedaços -->
    <use href="#carneP" transform="translate(-136 0)"/>
    <g transform="translate(-68 0)">
      <rect x="-25" y="-36" width="50" height="72" rx="11" fill="url(#cebola)" stroke="#9d4edd" stroke-width="5"/>
      <path d="M-12 -30 V30 M2 -30 V30" stroke="#c9a7e8" stroke-width="3" opacity="0.8"/>
    </g>
    <use href="#carneP" transform="translate(0 0)"/>
    <g transform="translate(68 0)">
      <rect x="-28" y="-38" width="56" height="76" rx="16" fill="url(#pimentao)"/>
      <rect x="-22" y="-33" width="44" height="16" rx="8" fill="#fff" opacity="0.2"/>
    </g>
    <use href="#carneP" transform="translate(136 0)"/>
  </g>
</svg>
